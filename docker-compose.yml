# Local development stack: `docker compose up --build`
# Works without a .env file (development defaults below); copy .env.example to .env
# to override values.

name: solangeglow

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-secret-key-change-me}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend}
  DATABASE_URL: postgis://${POSTGRES_USER:-solange}:${POSTGRES_PASSWORD:-solange}@db:5432/${POSTGRES_DB:-solangeglow}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  CHANNELS_REDIS_URL: redis://redis:6379/3

x-backend: &backend
  build:
    context: ./backend
    target: dev
  image: solangeglow-backend:dev
  env_file:
    - path: .env
      required: false
  environment: *backend-env
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solangeglow}
      POSTGRES_USER: ${POSTGRES_USER:-solange}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solange}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    <<: *backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info
    depends_on:
      backend:
        condition: service_healthy

  beat:
    <<: *backend
    command: celery -A config beat --loglevel=info
    depends_on:
      backend:
        condition: service_healthy

  web:
    build:
      context: ./web
      target: dev
    image: solangeglow-web:dev
    env_file:
      - path: .env
        required: false
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
      # File watching through Docker Desktop on Windows needs polling.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  web_node_modules:
  web_next:
