{% extends "admin/base_site.html" %}
{% load i18n %}

{% block breadcrumbs %}{% endblock %}

{% block content %}
  <form method="post" class="flex flex-col gap-4" style="max-width:520px">
    {% csrf_token %}
    <p>{% translate "The public page of this code will say that the certificate is no longer valid." %}</p>
    {{ form.as_div }}
    <div class="flex gap-3">
      <button type="submit" class="bg-primary-600 text-white rounded px-4 py-2 font-semibold">{% translate "Cancel the certificate" %}</button>
      <a class="underline" href="{{ back_url }}">{% translate "Back" %}</a>
    </div>
  </form>
{% endblock %}
