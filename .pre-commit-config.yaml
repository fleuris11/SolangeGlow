# Install once with: pip install pre-commit && pre-commit install
# (or inside Docker: docker compose exec backend pre-commit run --all-files)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.po$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=800"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: forbid-local-only-files
        name: forbid local-only files
        entry: local-only files must never be committed
        language: fail
        files: (^|/)(CLAUDE\.md|PROMPTS\.md|\.claude/.*|\.env)$
