# The production stack on one machine, without OVH nor a domain name: CI and local trials.
#   COMPOSE_FILES="-f docker-compose.prod.yml -f deploy/compose.test.yml" ...
# MinIO stands for the object storage, Caddy signs its own certificates for localhost.
services:
  minio:
    image: pgsty/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    networks: [back]

  createbuckets:
    image: pgsty/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
      MEDIA: ${AWS_STORAGE_BUCKET_NAME}
      SAFE: ${BACKUP_BUCKET}
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 1; done;
      mc mb --ignore-existing local/$$MEDIA && mc mb --ignore-existing local/$$SAFE &&
      mc anonymous set download local/$$MEDIA/public"
    networks: [back]

  migrate:
    depends_on:
      createbuckets:
        condition: service_completed_successfully

  backup:
    depends_on:
      createbuckets:
        condition: service_completed_successfully
