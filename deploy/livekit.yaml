# LiveKit in production (ADR-013). The key comes from LIVEKIT_KEYS (docker-compose.prod.yml).
port: 7880
bind_addresses:
  - 0.0.0.0
rtc:
  # Media ports, opened in the firewall (docs/deploiement.md).
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
redis:
  address: redis:6379
  db: 4
room:
  empty_timeout: 120
  departure_timeout: 20
webhook:
  api_key: solangeglow
  urls:
    - http://backend:8000/api/v1/livekit/webhook
logging:
  level: warn
