name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: solangeglow
          POSTGRES_USER: solange
          POSTGRES_PASSWORD: solange
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solange -d solangeglow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgis://solange:solange@localhost:5432/solangeglow
    steps:
      - uses: actions/checkout@v4

      - name: Install GDAL and gettext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin gettext

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Check migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Compile translations
        run: python manage.py compilemessages

      - name: Tests
        run: pytest

  web:
    name: Web (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          npm run lint
          npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
