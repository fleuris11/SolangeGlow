name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: solangeglow
          POSTGRES_USER: solange
          POSTGRES_PASSWORD: solange
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solange -d solangeglow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgis://solange:solange@localhost:5432/solangeglow
    steps:
      - uses: actions/checkout@v4

      - name: Install GDAL, gettext and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin gettext ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Check migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Compile translations
        run: python manage.py compilemessages

      - name: Tests
        run: pytest

      - name: API schema (no warning allowed)
        run: >-
          python manage.py spectacular --format openapi-json --lang en
          --file openapi.json --fail-on-warn --validate

      - name: Keep the API schema
        uses: actions/upload-artifact@v4
        with:
          name: api-schema
          path: backend/openapi.json

  api-client:
    name: Web API client is up to date
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: api-schema
          path: web

      - name: Generate the client from the schema
        run: API_SCHEMA=openapi.json npm run api:generate

      - name: Fail if src/lib/api/schema.d.ts was not regenerated
        run: |
          git diff --exit-code -- src/lib/api/schema.d.ts || {
            echo "::error::Run 'docker compose exec web npm run api:generate' and commit the result."
            exit 1
          }

  web:
    name: Web (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          npm run lint
          npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: JavaScript budget (230 KB gzip on the first load, ADR-004)
        run: npm run check:js-budget

  e2e:
    name: Web journeys (full stack, accessibility, screenshots)
    runs-on: ubuntu-latest
    needs: [backend, web]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Start the whole stack (database, Redis, MinIO, backend, worker, web)
        run: docker compose up -d --build

      - name: Wait for the backend and the web app
        run: |
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null \
              && curl -sf http://localhost:3000/fr > /dev/null; then
              echo "ready"; exit 0
            fi
            sleep 5
          done
          docker compose ps
          exit 1

      - name: Compile the pages once (development server)
        run: |
          for page in fr en sk fr/auth fr/welcome fr/me fr/notifications fr/design; do
            curl -s -o /dev/null --max-time 180 "http://localhost:3000/$page" || true
          done

      - name: Journeys, accessibility and screenshots
        run: docker compose run --rm -e CI=true e2e

      - name: Logs of the stack
        if: failure()
        run: docker compose logs --tail=300 backend worker web

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: web/e2e/screenshots/
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose down -v
